name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Website only (Firebase Hosting; no backend)'
        required: true
        type: choice
        default: hosting
        options:
          - hosting

jobs:
  release_scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      release_sha: ${{ steps.scope.outputs.release_sha }}
    steps:
      - name: Checkout exact release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup scope verifier
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify release scope
        id: scope
        run: |
          node --test scripts/release-scope.test.mjs scripts/verify-hosting-only.test.mjs
          node scripts/release-scope.mjs

  build_and_deploy:
    if: needs.release_scope.outputs.mode == 'hosting' || needs.release_scope.outputs.mode == 'full'
    needs: release_scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_scope.outputs.release_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install deterministic tooling
        run: npm ci
      - name: Build and verify site
        run: npm run check
      - name: Verify Hosting-only deployment boundary
        if: needs.release_scope.outputs.mode == 'hosting'
        run: |
          node --test scripts/verify-hosting-only.test.mjs
          node scripts/verify-hosting-only.mjs
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIMETIMEHOMEHEALTHSERVICES }}
          channelId: live
          projectId: primetimehomehealthservices
      - name: Verify restored insurance logos on the live website
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-insurance-logos.mjs --origin https://pthhs.net; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1

  # A Functions IAM failure must not prevent an independently verified static
  # website restoration from reaching Firebase Hosting.
  deploy_backend:
    # Manual releases are always website-only, regardless of supplied inputs.
    if: github.event_name == 'push' && needs.release_scope.outputs.mode == 'full'
    needs: release_scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js for Primetime backend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Primetime backend dependencies
        run: npm ci --prefix functions
      - name: Type-check and test Primetime backend
        run: npm test --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.0
      - name: Prepare Firebase deployment credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIMETIMEHOMEHEALTHSERVICES }}' > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Identify Firebase deployment service account
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Firebase deployment service account:', p.client_email);"
      - name: Prepare reviewed non-secret deployment parameters
        run: node functions/scripts/prepare-deploy-env.mjs
      - name: Verify required Primetime Firestore database
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node functions/scripts/verify-firestore-deployment.mjs
      # Firestore rules are published separately by an authorized operator.
      # The Functions deployer intentionally has no Firebase Rules admin access.
      - name: Deploy Primetime Functions
        id: deploy_functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions --project primetimehomehealthservices --non-interactive
      - name: Verify deployed revision monitor infrastructure
        if: ${{ success() && steps.deploy_functions.outcome == 'success' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node functions/scripts/verify-revision-monitor-deployment.mjs
      - name: Verify anonymous API boundary independently
        if: ${{ !cancelled() && (steps.deploy_functions.outcome == 'success' || steps.deploy_functions.outcome == 'failure') }}
        run: node functions/scripts/verify-anonymous-deployment.mjs
      - name: Report authenticated acceptance pending
        if: ${{ !cancelled() && (steps.deploy_functions.outcome == 'success' || steps.deploy_functions.outcome == 'failure') }}
        run: node functions/scripts/report-acceptance-pending.mjs

  # The website report source is an existing independent Functions codebase.
  # Keep Hosting-only manual releases and the HHA backend deployment separate.
  deploy_website_analytics:
    if: github.event_name == 'push' && needs.release_scope.outputs.mode == 'full'
    needs: [release_scope, build_and_deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js for website analytics
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned deployment tools
        run: npm install -g pnpm@11.25.0 firebase-tools@15.30.0
      - name: Install locked website analytics dependencies
        run: pnpm --dir analytics-functions install --frozen-lockfile --ignore-scripts
      - name: Verify website report contract
        run: pnpm --dir analytics-functions test
      - name: Prepare existing Firebase deployment credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIMETIMEHOMEHEALTHSERVICES }}' > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy only the website analytics codebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --config firebase.analytics.json --only functions:website-analytics --project primetimehomehealthservices --non-interactive
      - name: Verify anonymous website analytics boundary
        run: node analytics-functions/verify-deployment.mjs
