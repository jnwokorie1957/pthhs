name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deterministic tooling
        run: npm ci

      - name: Build and verify site
        run: npm run check

      - name: Setup Node.js for Primetime backend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Primetime backend dependencies
        run: npm ci --prefix functions

      - name: Type-check and test Primetime backend
        run: npm test --prefix functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.0

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIMETIMEHOMEHEALTHSERVICES }}
          channelId: live
          projectId: primetimehomehealthservices
