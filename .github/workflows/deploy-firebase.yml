name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install deterministic tooling
        run: npm ci
      - name: Build and verify site
        run: npm run check
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIMETIMEHOMEHEALTHSERVICES }}
          channelId: live
          projectId: primetimehomehealthservices
      - name: Verify restored insurance logos on the live website
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-insurance-logos.mjs --origin https://pthhs.net; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1

  # A Functions IAM failure must not prevent an independently verified static
  # website restoration from reaching Firebase Hosting.
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js for Primetime backend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Primetime backend dependencies
        run: npm ci --prefix functions
      - name: Type-check and test Primetime backend
        run: npm test --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.0
      - name: Prepare Firebase deployment credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIMETIMEHOMEHEALTHSERVICES }}' > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Identify Firebase deployment service account
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Firebase deployment service account:', p.client_email);"
      - name: Prepare reviewed non-secret deployment parameters
        run: node functions/scripts/prepare-deploy-env.mjs
      - name: Deploy Primetime Functions
        id: deploy_functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions --project primetimehomehealthservices --non-interactive
      - name: Verify anonymous API boundary independently
        if: ${{ !cancelled() && (steps.deploy_functions.outcome == 'success' || steps.deploy_functions.outcome == 'failure') }}
        run: node functions/scripts/verify-anonymous-deployment.mjs
      - name: Verify protected Primetime API and HHA connectivity
        if: ${{ !cancelled() && (steps.deploy_functions.outcome == 'success' || steps.deploy_functions.outcome == 'failure') }}
        run: node functions/scripts/verify-live-deployment.mjs
