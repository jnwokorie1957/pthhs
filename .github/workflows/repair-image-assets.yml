name: Repair PTHHS image assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-image-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair references and recover missing images
        run: |
          python scripts/repair_image_assets.py \
            --public public \
            --origin https://w13335.proweaversite13.com

      - name: Commit recovered assets and repaired references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No image repairs were needed."
            exit 0
          fi
          git commit -m "Repair broken image references and restore missing assets"
          git push origin HEAD:main
